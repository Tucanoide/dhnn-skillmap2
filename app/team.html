<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHNN · Mi equipo</title>
<link rel="stylesheet" href="shared.css?v=0aeb852b57">
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="pageTitle">Mi equipo</div>
        <div class="topbar-subtitle">Validá o ajustá la autoevaluación de cada persona</div>
      </div>
      <button class="btn secondary" id="backBtn" style="display:none;" onclick="showList()">← Volver al listado</button>
    </div>
    <div class="content" id="content">
      <div class="empty-state">Cargando…</div>
    </div>
  </div>
</div>

<script src="api.js?v=89c259c66e"></script>
<script>
requireAuth();
let TEAM = [];
let CURRENT_PERSON = null;

function renderTeamStats() {
  const withSkills = TEAM.filter(p => p.total > 0);
  const pct = withSkills.length ? Math.round(withSkills.reduce((a, p) => a + p.autoevaluados / p.total, 0) / withSkills.length * 100) : 0;
  return `
    <div class="stat-row">
      <div class="stat-tile" style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div><div class="tile-val">${TEAM.length}</div><div class="tile-lbl">Personas</div></div>
        <span style="position:relative;z-index:1;width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.24);display:grid;place-items:center;">${ICONS.team}</span>
      </div>
      <div class="stat-tile" style="display:flex;align-items:flex-start;justify-content:space-between;">
        <div><div class="tile-val">${pct}<span style="font-size:20px;opacity:.85;">%</span></div><div class="tile-lbl">Skills autoevaluadas (prom.)</div></div>
        <span style="position:relative;z-index:1;width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.24);display:grid;place-items:center;">${ICONS.ai}</span>
      </div>
    </div>
  `;
}

function renderList() {
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('pageTitle').textContent = currentUser().esAdmin ? 'Todo el equipo' : 'Mi equipo';
  document.getElementById('content').innerHTML = `
    ${renderTeamStats()}
    <div class="card">
      <div class="card-header"><div class="card-title">Personas (${TEAM.length})</div></div>
      <div class="card-body" style="padding:0;">
        <table class="data-table">
          <thead><tr><th>Nombre</th><th>Puesto</th><th>Área</th><th>Autoevaluación</th><th></th></tr></thead>
          <tbody>
            ${TEAM.map(p => {
              const pct = p.total ? p.autoevaluados / p.total : 0;
              return `
              <tr>
                <td><div style="display:flex;align-items:center;gap:10px;"><span class="avatar" style="width:32px;height:32px;border-radius:50%;font-size:11px;background:${avatarBg(p.nombre)};color:var(--ink-1);">${initials(p.nombre)}</span>${p.nombre}</div></td>
                <td>${p.rol_puesto}</td>
                <td>${p.area}</td>
                <td><div style="display:flex;align-items:center;gap:10px;">${ringSvg(pct, { size: 32, stroke: 3.5, color: p.total && p.autoevaluados === p.total ? 'var(--ok)' : 'var(--core)', label: `<span style="font-size:9px;font-weight:650;">${Math.round(pct*100)}%</span>` })}<span class="num" style="font-weight:600;">${p.autoevaluados}/${p.total}</span></div></td>
                <td><a onclick="openPerson(${p.id})">Ver / validar →</a></td>
              </tr>
            `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function showList() { CURRENT_PERSON = null; renderList(); }

async function openPerson(id) {
  CURRENT_PERSON = await api(`/team/${id}`);
  document.getElementById('backBtn').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = CURRENT_PERSON.persona.nombre;
  renderPerson();
}

function renderPerson() {
  const { persona, skills } = CURRENT_PERSON;
  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="avatar" style="background:${avatarBg(persona.nombre)};color:var(--ink-1);">${initials(persona.nombre)}</div>
      <div class="hero-info">
        <div class="hero-name">${persona.nombre}</div>
        <div class="hero-role">${persona.rol_puesto} · ${persona.area}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Skills — autoevaluación y validación</div></div>
      <div class="card-body" style="padding:0;">
        ${skills.map(s => `
          <div class="skill-row" style="grid-template-columns:1fr 100px 130px 220px;">
            <div>
              <div class="skill-name">${s.nombre}</div>
              <div class="skill-cat">${BUCKET_META[s.bucket].label} · ${s.categoria}</div>
            </div>
            <div class="level-txt">Autoeval: ${s.nivel_actual}</div>
            <div class="level-txt">${s.lider_validacion_fecha ? '✓ ' + s.lider_validacion_fecha : 'Sin validar'}</div>
            <div>
              <div class="eval-buttons">
                ${[0,1,2,3,4,5].map(n => `<button class="eval-btn ${s.nivel_actual===n?'active':''}" onclick="validar(${s.skill_id},${n})">${n}</button>`).join('')}
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function validar(skillId, nivel) {
  await api(`/team/${CURRENT_PERSON.persona.id}/skills/${skillId}/validar`, {
    method: 'POST',
    body: JSON.stringify({ nivel_actual: nivel, ajustar: true }),
  });
  await openPerson(CURRENT_PERSON.persona.id);
}

async function load() {
  const user = currentUser();
  if (!user.esLider && !user.esAdmin) {
    document.getElementById('content').innerHTML = '<div class="error-banner">No tenés equipo a cargo.</div>';
    return;
  }
  document.getElementById('sidebar').innerHTML = renderSidebarShell('team', user);
  TEAM = await api('/team');
  renderList();
}
load().catch(err => {
  document.getElementById('content').innerHTML = `<div class="error-banner">${err.message}</div>`;
});
</script>
</body>
</html>
