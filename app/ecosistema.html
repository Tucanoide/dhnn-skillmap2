<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHNN · Ecosistema de partners</title>
<link rel="stylesheet" href="shared.css?v=0aeb852b57">
<style>
.kcol{min-width:270px;flex:1;background:var(--chip);border-radius:20px;padding:14px;}
.kcol-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 4px;}
.kcol-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-1);}
.kcol-count{font-size:11px;font-weight:700;color:#fff;background:var(--ink-1);border-radius:20px;min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;}
.pcard{background:var(--glass-a);-webkit-backdrop-filter:blur(20px) saturate(1.7);backdrop-filter:blur(20px) saturate(1.7);border-radius:18px;padding:14px;margin-bottom:10px;border-top:3px solid var(--accent,var(--core));box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--glass-edge), var(--shadow);transition:box-shadow .2s ease,transform .2s ease;}
.pcard:hover{box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--glass-edge), var(--shadow-lg);transform:translateY(-2px);}
.pcard-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.pcard-avatar{width:38px;height:38px;border-radius:50%;background:var(--accent,var(--core));color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.pcard-name{font-size:13px;font-weight:700;color:var(--ink-1);}
.pcard-role{font-size:11px;color:var(--ink-muted);}
.pcard-actions{display:flex;gap:12px;font-size:11.5px;padding-top:8px;border-top:1px solid var(--hair);}
.pcard-actions a{color:var(--core);cursor:pointer;font-weight:600;}
.crm-toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.crm-search{flex:1;min-width:220px;}
.crm-search label,.crm-filter label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted);margin-bottom:5px;}
.crm-search input,.crm-filter select{width:100%;height:38px;padding:0 12px;border:0;border-radius:14px;background:var(--field);box-shadow:inset 0 0 0 1px var(--hair);font:inherit;font-size:12.5px;color:var(--ink-1);}
.crm-filter{width:170px;}
.crm-count{font-size:11px;color:var(--ink-muted);margin:0 0 8px 2px;}
.crm-table-wrap{background:var(--glass-a);-webkit-backdrop-filter:blur(24px) saturate(1.7);backdrop-filter:blur(24px) saturate(1.7);border-radius:20px;overflow:auto;box-shadow:inset 0 1px 0 var(--hi), inset 0 0 0 1px var(--glass-edge), var(--shadow);}
.crm-table{width:100%;min-width:780px;border-collapse:collapse;font-size:12.5px;}
.crm-table th{padding:12px 16px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-muted);font-weight:650;border-bottom:1px solid var(--hair);white-space:nowrap;}
.crm-table td{padding:13px 16px;border-bottom:1px solid var(--hair);vertical-align:middle;color:var(--ink-2);}
.crm-table tr:last-child td{border-bottom:0;}
.crm-table tr:hover td{background:var(--chip);}
.crm-person{display:flex;align-items:center;gap:10px;min-width:190px;}
.crm-avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;}
.crm-name{font-weight:700;color:var(--ink-1);}
.crm-meta{font-size:10px;color:var(--ink-muted);margin-top:2px;}
.crm-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;white-space:nowrap;}
.crm-status:before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor;}
.crm-status.active{color:var(--ok);}.crm-status.review{color:#b8860b;}.crm-status.new{color:var(--core);}
.crm-actions{display:flex;gap:6px;white-space:nowrap;}
.crm-actions button{border:0;background:transparent;color:var(--core);font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:3px;}
.crm-actions button:hover{text-decoration:underline;}
.crm-empty{padding:34px;text-align:center;color:var(--ink-muted);font-size:12px;}
@media(max-width:760px){.content{padding:18px 14px 36px}.stat-row{grid-template-columns:1fr}.crm-filter{flex:1;min-width:140px}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="pageTitle">Ecosistema de partners</div>
        <div class="topbar-subtitle">Freelancers y partners externos — subí su CV y la IA arma su perfil de skills</div>
      </div>
      <button class="btn secondary" id="backBtn" style="display:none;" onclick="renderBoard()">← Volver</button>
    </div>
    <div class="content" id="content">
      <div class="empty-state">Cargando…</div>
    </div>
  </div>
</div>

<script src="api.js?v=89c259c66e"></script>
<script>
requireAuth();
let PARTNERS = [];
let partnerSearch = '';
let partnerArea = '';
let partnerStatus = '';
const ACCENTS = ['#2a78d6', '#1baf7a', '#eb9c00', '#8a5cf6', '#e05d8f', '#0d9488'];
function accentFor(area, areas) { return ACCENTS[areas.indexOf(area) % ACCENTS.length]; }

function partnerStatusFor(partner) {
  if (!partner.total) return { label: 'Sin perfil', className: 'new' };
  if (!partner.autoevaluados) return { label: 'Para revisar', className: 'review' };
  return { label: 'Activo', className: 'active' };
}

function filteredPartners() {
  const search = partnerSearch.trim().toLowerCase();
  return PARTNERS.filter(p => {
    const haystack = [p.nombre, p.email, p.rol_puesto, p.area, p.seniority].filter(Boolean).join(' ').toLowerCase();
    const status = partnerStatusFor(p);
    return (!search || haystack.includes(search)) && (!partnerArea || p.area === partnerArea) && (!partnerStatus || status.className === partnerStatus);
  });
}

function updatePartnerList() {
  const rows = filteredPartners();
  const areas = [...new Set(PARTNERS.map(p => p.area))].sort();
  const body = document.getElementById('partnerRows');
  const count = document.getElementById('partnerCount');
  if (!body || !count) return;
  count.textContent = `${rows.length} de ${PARTNERS.length} partners`;
  body.innerHTML = rows.length ? rows.map(p => {
    const status = partnerStatusFor(p);
    const accent = AVATAR_BG[normName(p.nombre)] || accentFor(p.area, areas);
    const textColor = AVATAR_BG[normName(p.nombre)] ? 'var(--ink-1)' : '#fff';
    return `<tr>
      <td><div class="crm-person"><div class="crm-avatar" style="background:${accent};color:${textColor};">${initials(p.nombre)}</div><div><div class="crm-name">${p.nombre}</div><div class="crm-meta">${p.email || 'Sin email'}</div></div></div></td>
      <td><div class="crm-name" style="font-size:12px;font-weight:500;">${p.rol_puesto || 'Sin rol'}</div><div class="crm-meta">${p.seniority || 'Seniority no definido'}</div></td>
      <td>${p.area || 'Sin área'}</td>
      <td><span class="crm-status ${status.className}">${status.label}</span></td>
      <td>${p.total ? `${p.autoevaluados || 0}/${p.total} skills` : 'Sin skills'}</td>
      <td><div class="crm-actions"><button onclick="openProfile(${p.id})">Ver perfil</button><button onclick="openPartnerForm(${p.id})">Editar</button><button onclick="openPartnerCVForm(${p.id})">CV</button></div></td>
    </tr>`;
  }).join('') : '<tr><td colspan="6"><div class="crm-empty">No encontramos partners con estos filtros.</div></td></tr>';
}

function statIcon(svg) { return `<span style="position:relative;z-index:1;width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.24);display:grid;place-items:center;flex:none;">${svg}</span>`; }
function renderStats() {
  const areas = [...new Set(PARTNERS.map(p => p.area))];
  const conSkills = PARTNERS.filter(p => p.autoevaluados > 0 || p.total > 0).length;
  return `
    <div class="stat-row">
      <div class="stat-tile" style="display:flex;align-items:flex-start;justify-content:space-between;"><div><div class="tile-val">${PARTNERS.length}</div><div class="tile-lbl">Partners en el ecosistema</div></div>${statIcon(ICONS.partners)}</div>
      <div class="stat-tile" style="display:flex;align-items:flex-start;justify-content:space-between;"><div><div class="tile-val">${areas.length}</div><div class="tile-lbl">Áreas representadas</div></div>${statIcon(ICONS.layers)}</div>
      <div class="stat-tile" style="display:flex;align-items:flex-start;justify-content:space-between;"><div><div class="tile-val">${conSkills}</div><div class="tile-lbl">Con skills cargadas</div></div>${statIcon(ICONS.check)}</div>
    </div>
  `;
}

function renderBoard() {
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('pageTitle').textContent = 'Ecosistema de partners';
  const areas = [...new Set(PARTNERS.map(p => p.area))].sort();
  document.getElementById('content').innerHTML = `
    ${renderStats()}
    <div class="crm-toolbar">
      <div class="crm-search"><label>Buscar partner</label><input id="partnerSearch" type="search" placeholder="Nombre, email, rol o área" value="${partnerSearch}" oninput="partnerSearch=this.value;updatePartnerList()"></div>
      <div class="crm-filter"><label>Área</label><select onchange="partnerArea=this.value;updatePartnerList()"><option value="">Todas las áreas</option>${areas.map(area => `<option value="${area}" ${partnerArea===area?'selected':''}>${area}</option>`).join('')}</select></div>
      <div class="crm-filter"><label>Estado</label><select onchange="partnerStatus=this.value;updatePartnerList()"><option value="">Todos los estados</option><option value="active" ${partnerStatus==='active'?'selected':''}>Activo</option><option value="review" ${partnerStatus==='review'?'selected':''}>Para revisar</option><option value="new" ${partnerStatus==='new'?'selected':''}>Sin perfil</option></select></div>
      <button class="btn" onclick="openPartnerForm()">+ Nuevo partner (subir CV)</button>
    </div>
    <div class="crm-count" id="partnerCount"></div>
    <div class="crm-table-wrap"><table class="crm-table"><thead><tr><th>Partner</th><th>Especialidad</th><th>Área</th><th>Estado</th><th>Skills</th><th>Acciones</th></tr></thead><tbody id="partnerRows"></tbody></table></div>
  `;
  updatePartnerList();
}

// -------------------- alta / edición --------------------

function openPartnerForm(id) {
  const p = id ? PARTNERS.find(x => x.id === id) : {};
  document.getElementById('backBtn').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = id ? 'Editar partner' : 'Nuevo partner';
  document.getElementById('content').innerHTML = `
    <div class="card"><div class="card-body">
      <div class="form-grid">
        <div class="form-row"><label>Nombre</label><input id="pf_nombre" value="${p.nombre || ''}"></div>
        <div class="form-row"><label>Email</label><input id="pf_email" value="${p.email || ''}"></div>
        <div class="form-row"><label>Especialidad / rol</label><input id="pf_rol" value="${p.rol_puesto || ''}" placeholder="Ej: Motion Designer, Backend Dev..."></div>
        <div class="form-row"><label>Área</label><input id="pf_area" value="${p.area || ''}" placeholder="Ej: Desarrollo, Diseño, Marketing..."></div>
        <div class="form-row"><label>Seniority</label><input id="pf_seniority" value="${p.seniority || ''}" placeholder="Ssr, Sr, Líder…"></div>
        ${!id ? '<div class="form-row"><label>CV (PDF)</label><input type="file" id="pf_cv" accept="application/pdf"></div>' : ''}
      </div>
      <div id="pf_error" class="error-banner" style="display:none;"></div>
      <button class="btn" id="pf_btn" onclick="${id ? `savePartner(${id})` : 'createPartnerWithCV()'}">${id ? 'Guardar' : 'Crear y analizar CV'}</button>
    </div></div>
  `;
}

function partnerBody() {
  return {
    nombre: document.getElementById('pf_nombre').value,
    email: document.getElementById('pf_email').value,
    rol_puesto: document.getElementById('pf_rol').value,
    area: document.getElementById('pf_area').value,
    banda: 'Freelance',
    seniority: document.getElementById('pf_seniority').value || null,
    lider_id: null,
    es_admin: false,
    tipo: 'freelance',
  };
}

async function savePartner(id) {
  const errorEl = document.getElementById('pf_error');
  errorEl.style.display = 'none';
  try {
    await api(`/admin/people/${id}`, { method: 'PUT', body: JSON.stringify(partnerBody()) });
    await loadAll();
    renderBoard();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
}

async function createPartnerWithCV() {
  const errorEl = document.getElementById('pf_error');
  const btn = document.getElementById('pf_btn');
  const file = document.getElementById('pf_cv').files[0];
  const body = partnerBody();
  errorEl.style.display = 'none';
  if (!body.nombre || !body.email || !body.rol_puesto || !body.area) {
    errorEl.textContent = 'Completá nombre, email, especialidad y área.';
    errorEl.style.display = 'block';
    return;
  }
  if (!file) {
    errorEl.textContent = 'Subí el CV en PDF para que la IA detecte sus skills.';
    errorEl.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = 'Analizando CV…';
  try {
    const created = await api('/admin/people', { method: 'POST', body: JSON.stringify(body) });
    const result = await uploadCV(created.id, file);
    await loadAll();
    renderCVReview(created.id, body.nombre, result);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Crear y analizar CV';
  }
}

function openPartnerCVForm(personId) {
  const p = PARTNERS.find(x => x.id === personId);
  document.getElementById('backBtn').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = 'Subir CV — ' + p.nombre;
  document.getElementById('content').innerHTML = `
    <div class="card"><div class="card-body">
      <div class="form-row"><label>CV (PDF)</label><input type="file" id="pf2_cv" accept="application/pdf"></div>
      <div id="pf2_error" class="error-banner" style="display:none;"></div>
      <button class="btn" id="pf2_btn" onclick="analyzeExistingPartnerCV(${personId})">Analizar CV</button>
    </div></div>
  `;
}

async function analyzeExistingPartnerCV(personId) {
  const errorEl = document.getElementById('pf2_error');
  const btn = document.getElementById('pf2_btn');
  const file = document.getElementById('pf2_cv').files[0];
  errorEl.style.display = 'none';
  if (!file) { errorEl.textContent = 'Subí un PDF.'; errorEl.style.display = 'block'; return; }
  btn.disabled = true; btn.textContent = 'Analizando CV…';
  try {
    const p = PARTNERS.find(x => x.id === personId);
    const result = await uploadCV(personId, file);
    renderCVReview(personId, p.nombre, result);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Analizar CV';
  }
}

async function uploadCV(personId, file) {
  const token = getToken();
  const fd = new FormData();
  fd.append('file', file);
  const res = await fetch(`${API_BASE}/admin/people/${personId}/cv`, {
    method: 'POST',
    headers: token ? { 'Authorization': 'Bearer ' + token } : {},
    body: fd,
  });
  if (res.status === 401) { clearSession(); window.location.href = 'login.html'; throw new Error('401'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.detail || ('Error ' + res.status));
  return body;
}

function renderCVReview(personId, nombre, result) {
  document.getElementById('pageTitle').textContent = 'Skills detectadas — ' + nombre;
  document.getElementById('content').innerHTML = `
    <div class="card" style="margin-bottom:16px;"><div class="card-body">
      <div style="color:var(--ink-2);">${result.resumen || ''}</div>
    </div></div>
    <div class="card">
      <div class="card-header"><div class="card-title">Revisá y ajustá antes de guardar (${result.skills_detectadas.length})</div></div>
      <div class="card-body" style="padding:0;">
        ${result.skills_detectadas.map((s, i) => `
          <div class="skill-row" style="grid-template-columns:24px 1fr 90px;">
            <input type="checkbox" id="cv_use_${i}" checked>
            <div>
              <div class="skill-name">${s.nombre}</div>
              <div class="skill-cat">${s.evidencia}</div>
            </div>
            <input type="number" min="0" max="5" value="${s.nivel_estimado}" id="cv_nivel_${i}" style="width:60px;">
          </div>
        `).join('') || '<div class="empty-state">La IA no detectó skills del catálogo en este CV.</div>'}
      </div>
    </div>
    <div id="cv_error" class="error-banner" style="display:none;margin-top:12px;"></div>
    <button class="btn" style="margin-top:12px;" onclick='saveCVSkills(${personId}, ${JSON.stringify(result.skills_detectadas).replace(/'/g, "&#39;")})'>Guardar skills seleccionadas</button>
  `;
}

async function saveCVSkills(personId, skills) {
  const errorEl = document.getElementById('cv_error');
  errorEl.style.display = 'none';
  try {
    for (let i = 0; i < skills.length; i++) {
      if (!document.getElementById(`cv_use_${i}`).checked) continue;
      const nivel = Number(document.getElementById(`cv_nivel_${i}`).value);
      const skillId = skills[i].skill_id;
      await api(`/admin/people/${personId}/skills`, { method: 'POST', body: JSON.stringify({ skill_id: skillId, bucket: 'core', nivel_objetivo: nivel }) });
      await api(`/team/${personId}/skills/${skillId}/validar`, { method: 'POST', body: JSON.stringify({ nivel_actual: nivel, ajustar: true }) });
    }
    await loadAll();
    renderBoard();
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
}

// -------------------- detalle de skills (ver / editar nivel) --------------------

async function openProfile(id) {
  const profile = await api(`/team/${id}`);
  document.getElementById('backBtn').style.display = 'inline-flex';
  document.getElementById('pageTitle').textContent = profile.persona.nombre;
  const { persona, skills } = profile;
  document.getElementById('content').innerHTML = `
    <div class="hero">
      <div class="avatar" style="background:${avatarBg(persona.nombre)};color:var(--ink-1);">${initials(persona.nombre)}</div>
      <div class="hero-info">
        <div class="hero-name">${persona.nombre}</div>
        <div class="hero-role">${persona.rol_puesto} · ${persona.area}</div>
      </div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Skills</div></div>
      <div class="card-body" style="padding:0;">
        ${skills.map(s => `
          <div class="skill-row" style="grid-template-columns:1fr 100px 220px;">
            <div>
              <div class="skill-name">${s.nombre}</div>
              <div class="skill-cat">${BUCKET_META[s.bucket].label} · ${s.categoria} · objetivo ${s.nivel_objetivo}</div>
            </div>
            <div class="level-txt">Nivel: ${s.nivel_actual}</div>
            <div class="eval-buttons">
              ${[0,1,2,3,4,5].map(n => `<button class="eval-btn ${s.nivel_actual===n?'active':''}" onclick="editProfileSkill(${id},${s.skill_id},${n})">${n}</button>`).join('')}
            </div>
          </div>
        `).join('') || '<div class="empty-state">Sin skills asignadas todavía.</div>'}
      </div>
    </div>
  `;
}

async function editProfileSkill(personId, skillId, nivel) {
  await api(`/team/${personId}/skills/${skillId}/validar`, { method: 'POST', body: JSON.stringify({ nivel_actual: nivel, ajustar: true }) });
  openProfile(personId);
}

async function loadAll() {
  const team = await api('/team');
  PARTNERS = team.filter(p => p.tipo === 'freelance');
}

async function load() {
  const user = currentUser();
  if (!user.esAdmin) {
    document.getElementById('content').innerHTML = '<div class="error-banner">Esta sección es solo para administradores (People).</div>';
    return;
  }
  document.getElementById('sidebar').innerHTML = renderSidebarShell('ecosistema', user);
  await loadAll();
  renderBoard();
}
load().catch(err => {
  document.getElementById('content').innerHTML = `<div class="error-banner">${err.message}</div>`;
});
</script>
</body>
</html>
