<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHNN · Skill Map · Ingresar</title>
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>DHNN Skill Map</h1>
    <p id="subtitle">Ingresá con tu email de DHNN. Si es tu primera vez, la contraseña que pongas queda guardada.</p>
    <div id="error" class="error-banner" style="display:none;"></div>
    <form id="loginForm">
      <div class="form-row">
        <label>Email</label>
        <input type="email" id="email" placeholder="nombre@dhnn.com" required>
      </div>
      <div class="form-row">
        <label>Contraseña</label>
        <input type="password" id="password" required minlength="4">
      </div>
      <button class="btn" type="submit" style="width:100%;justify-content:center;" id="submitBtn">Ingresar</button>
    </form>
  </div>
</div>

<script src="api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  const btn = document.getElementById('submitBtn');
  errorEl.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try {
    const data = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('email').value.trim().toLowerCase(),
        password: document.getElementById('password').value,
      }),
    });
    setSession(data);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Ingresar';
  }
});
</script>
</body>
</html>
