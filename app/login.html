<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHNN · Skill Map · Ingresar</title>
<link rel="stylesheet" href="shared.css?v=d8d1ef0b74">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h1>DHNN Skill Map</h1>
    <p id="subtitle">Ingresá con tu cuenta de Google de DHNN (@dhnn.com).</p>
    <div id="error" class="error-banner" style="display:none;"></div>
    <div id="gsiButton" style="display:flex;justify-content:center;margin-top:8px;"></div>
  </div>
</div>

<script src="api.js?v=8d5cd7e93c"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const GOOGLE_CLIENT_ID = '776763017999-rniqqqcskrgnanq8f0iplmdmrp7kb2ss.apps.googleusercontent.com';

async function handleGoogleCredential(response) {
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';
  try {
    const data = await api('/auth/google', {
      method: 'POST',
      body: JSON.stringify({ credential: response.credential }),
    });
    setSession(data);
    window.location.href = 'dashboard.html';
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
}

function initGoogleButton() {
  if (!window.google) { setTimeout(initGoogleButton, 100); return; }
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleGoogleCredential,
    hd: 'dhnn.com',
  });
  google.accounts.id.renderButton(
    document.getElementById('gsiButton'),
    { theme: 'outline', size: 'large', width: 280, text: 'signin_with' }
  );
}
initGoogleButton();
</script>
</body>
</html>
